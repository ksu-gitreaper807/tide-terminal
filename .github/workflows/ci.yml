name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PROPTEST_CASES: '256'
      PROPTEST_RNG_SEED: '20261112'
      # Ubuntu's global zshrc otherwise compinit-prompts on runner-owned fpath entries.
      skip_global_compinit: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install shell and desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev xvfb xauth mesa-vulkan-drivers python3-xlib python3-pil btop less man-db manpages
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          echo "version=$(rustc -V | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        id: rust
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust, terminal parser and Bash/Zsh/Fish PTY tests
        run: |
          mkdir -p qa-results
          cargo test --all-targets --locked -- --test-threads=1 2>&1 | tee qa-results/rust-tests.log
      - name: Build test executable
        run: |
          cargo build --locked
          mkdir -p bin
          cp target/debug/tide-terminal bin/tide-terminal
      - name: CLI and timer integration tests
        run: |
          mkdir -p .ci-work qa-results
          python3 scripts/cli_smoke.py --binary "$PWD/bin/tide-terminal" --work-dir "$PWD/.ci-work" --report "$PWD/qa-results/cli.json"
          python3 scripts/timer_smoke.py --binary "$PWD/bin/tide-terminal" --launcher "$PWD/T_:" --work-dir "$PWD/.ci-work" --report "$PWD/qa-results/timer.json"
      - name: GUI integration on explicitly selected software renderer
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 scripts/gui_smoke.py --gpu software --binary "$PWD/bin/tide-terminal" --work-dir "$PWD/.ci-work" --output-dir "$PWD/qa-results/gui-software" --btop-binary /usr/bin/btop
      - name: Record hardware validation boundary
        if: always()
        run: |
          mkdir -p qa-results
          echo 'Hosted GUI checks explicitly use CPU rendering. Real iGPU/discrete hardware is not established here; see tests/README.md for local checks.' > qa-results/hardware-not-run.txt
          echo 'Rust/PTY, parser/property tests, CLI/timer integration, software-rendered GUI, formatting and strict Clippy run here. Real GPU validation remains separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: qa-results/
          if-no-files-found: error
          retention-days: 14
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [metadata, completion]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install fuzz toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly -Vv
          cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock') }}-
      - name: Restore learned corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Coverage-guided sanitizer fuzzing
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          mkdir -p qa-results fuzz/artifacts
          duration=60
          if [ "$RUN_EVENT" = schedule ]; then duration=600; fi
          cargo +nightly metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > qa-results/fuzz-dependencies.json
          CARGO_NET_OFFLINE=true cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time="$duration" -max_len=4096 -rss_limit_mb=2048 2>&1 | tee "qa-results/fuzz-$FUZZ_TARGET.log"
      - name: Upload fuzz evidence and reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            qa-results/
            fuzz/artifacts/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
