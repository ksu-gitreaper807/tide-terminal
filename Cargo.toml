[package]
name = "tide-terminal"
version = "0.1.0"
edition = "2024"
description = "A native Rust terminal with shell integration, attention alerts, and command rules"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:image", "dep:ttf-parser", "dep:raw-window-handle", "dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols", "dep:zbus", "dep:async-channel", "dep:futures-lite", "dep:x11rb"]

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
humantime = "2"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"], optional = true }
libc = "0.2"
portable-pty = "0.9"
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
ttf-parser = { version = "0.25", optional = true }
vte = "0.15"
zbus = { version = "5", optional = true }
async-channel = { version = "2", optional = true }
futures-lite = { version = "2", optional = true }
x11rb = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wayland-client = { version = "0.31.10", optional = true }
wayland-backend = { version = "0.3.10", features = ["client_system"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
flate2 = "1"
proptest = "1.12.0"

